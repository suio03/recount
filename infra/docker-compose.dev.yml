# Local development databases. Ports are offset to avoid clashing with services already on the host.
name: recount-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recount
      POSTGRES_PASSWORD: recount
      POSTGRES_DB: recount
    ports: ["127.0.0.1:5442:5432"]
    volumes: [postgres:/var/lib/postgresql/data]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_USER: recount
      CLICKHOUSE_PASSWORD: recount
      CLICKHOUSE_DB: recount
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:8133:8123"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: [clickhouse:/var/lib/clickhouse]

volumes:
  postgres:
  clickhouse:
